services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: plc_postgres
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    environment:
      POSTGRES_USER: plcuser
      POSTGRES_PASSWORD: plcpassword_dev
      POSTGRES_DB: plcdata
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plcuser -d plcdata"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  backend:
    build:
      context: ./Services/Backend
    container_name: plc_backend
    env_file:
      - ./Services/Backend/.env.docker
    environment:
      RUNNING_IN_DOCKER: "1"
    working_dir: /app
    volumes:
      - ./Services/Backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data: